# Não é para aplicar: é o pod que o Bravis CRIA, escrito à mão, para leitura.
#
# Quando um passo assim é publicado…
#
#   name: platform_workspace
#   image: us-central1-docker.pkg.dev/zarv/apps/dbt:1.10.3
#   resources: {cpu: 200m, memory: 1Gi, limits: {memory: 2Gi}}
#   steps:
#     - id: bronze_workspace
#       run: dbt build --select bronze_workspace+
#
# …o scheduler monta exatamente isto:
apiVersion: v1
kind: Pod
metadata:
  # Determinístico por (run, passo, tentativa). Se o scheduler morrer entre
  # criar o pod e registrar isso, a próxima tentativa reencontra ESTE pod em vez
  # de subir um segundo rodando o mesmo dbt em paralelo.
  name: platform-workspace-bronze-workspace-a632ae46
  namespace: dados
  labels:
    app.kubernetes.io/managed-by: bravis
    bravis.dev/workflow: platform-workspace
    bravis.dev/node: bronze-workspace
    bravis.dev/run: 1f2e3d4c-0000-0000-0000-000000000000
  annotations:
    # O valor original: rótulo tem limite de 63 caracteres e alfabeto restrito.
    bravis.dev/workflow: platform_workspace
spec:
  restartPolicy: Never          # quem conta tentativas é o dispatcher
  serviceAccountName: bravis-task
  activeDeadlineSeconds: 1800   # rede de segurança do lado do cluster
  containers:
    - name: step
      image: us-central1-docker.pkg.dev/zarv/apps/dbt:1.10.3
      command: ["/bin/sh", "-c", "dbt build --select bronze_workspace+"]
      envFrom:
        - secretRef: {name: bravis-task-env}
      resources:
        requests: {cpu: 200m, memory: 1Gi}
        limits: {memory: 2Gi}
