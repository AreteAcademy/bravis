# ILUSTRATIVO: `kubernetes.run` e `bravis run --select` ainda nao existem, entao
# este arquivo mostra o FORMATO, nao um workflow executavel. O que roda de
# verdade e `examples/hello.yaml`.
#
# A mesma engine com dependencias explicitas, para o caso em que a ordem nao e
# linear. Aqui gold_metrics e gold_users rodam EM PARALELO depois do silver.
name: daily_analytics
type: dag
tags: [analytics, dbt, diario]

steps:
  - id: ingest_users
    action: kubernetes.run
    with:
      image: company/ingestion:latest

  - id: transform_silver
    run: bravis run --select silver.*
    depends_on: [ingest_users]

  - id: gold_metrics
    run: bravis run --select gold.metrics
    depends_on: [transform_silver]

  - id: gold_users
    run: bravis run --select gold.users
    depends_on: [transform_silver]

  - id: publish
    run: ./publish.sh
    depends_on: [gold_metrics, gold_users]
