[build]
  publish = "."
  command = ""

[context.production]
  command = ""

[[redirects]]
  from = "/github"
  to = "https://github.com/AreteAcademy/bravis"
  status = 301

[[redirects]]
  from = "/docs"
  to = "https://github.com/AreteAcademy/bravis/tree/main/docs"
  status = 301

[[redirects]]
  from = "/issues"
  to = "https://github.com/AreteAcademy/bravis/issues"
  status = 301

[[redirects]]
  from = "/discussions"
  to = "https://github.com/AreteAcademy/bravis/discussions"
  status = 301

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"