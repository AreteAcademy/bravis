# Identidade visual da instalacao.
#
# Copie para `brand.yaml` na raiz (ou aponte BREVIS_BRAND_FILE) e ajuste. Todos
# os campos sao opcionais: o que voce nao escrever mantem o padrao, entao um
# arquivo com apenas `titulo:` ja e valido.
#
# O que NAO se customiza: a linha "Powered by Brevis" no rodape da barra
# lateral. Ela nao e um campo deste arquivo — vem do codigo.

titulo: Brevis                # barra lateral e <title> das paginas
subtitulo: Orquestração       # versalete sob o titulo

# Marca grafica ao lado do titulo, na barra lateral e na tela de entrada.
# Aceita URL (https:// ou http://) ou caminho interno comecando em `/`.
# Ausente, usa o simbolo embutido do Brevis, que acompanha a cor do tema.
#
# Uma logo hospedada fora depende daquele host: se ele cair, ou se o cluster nao
# tiver saida para a internet, a imagem nao carrega — o resto da interface segue
# funcionando, mas conte com isso ao escolher.
# logo: https://exemplo.com/marca.svg

# A quebra de linha e preservada: ela define o ritmo da frase na barra lateral.
frase: |
  Clareza, estrutura e virtude
  também fazem parte
  de quem constrói.

# Cores. Hexadecimal (#rgb, #rrggbb ou #rrggbbaa) — qualquer outra coisa e
# recusada no boot, e a instalacao sobe com o tema padrao e um aviso no log.
#
# `--color-line` e o realce dourado sao derivados de `tinta` e `destaque`, com
# transparencia. Nao ha campo para eles de proposito: uma borda que nao combina
# com a propria tinta escolhida e um erro que ninguem quer poder cometer.
tema:
  fundo: "#f4efe4"           # papel
  fundo_suave: "#fbf8f1"     # topo e base do degrade
  superficie: "#fffdf8"      # cartoes e tabelas
  tinta: "#21180f"           # texto principal
  texto_suave: "#6e6254"     # texto secundario
  destaque: "#aa8450"        # detalhes e links
  destaque_forte: "#8a693d"  # versaletes

  # Estados de execucao. Valem a pena manter distinguiveis entre si mesmo em
  # tela ruim — sao a informacao mais importante do painel.
  sucesso: "#4c7a56"
  falha: "#b0503c"
  executando: "#3f6d8f"
  fila: "#b3822f"
  repetindo: "#a35f28"
  cancelado: "#8a8175"
  aguardando: "#a89b8a"
