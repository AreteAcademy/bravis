# Ambiente local da Phase 0: Postgres + API, nada mais.
#
# `docker compose up` deve deixar GET /health e GET /ready respondendo, que e o
# criterio de conclusao da fase (secao 39 do plano).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bravis
      POSTGRES_PASSWORD: bravis
      POSTGRES_DB: bravis
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      # A API so sobe depois que o banco aceita conexao — sem isso o primeiro
      # start falha por corrida, e o compose fica num restart loop confuso.
      test: ["CMD-SHELL", "pg_isready -U bravis -d bravis"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build:
      context: .
      target: api
    command: ["migrate", "up"]
    environment:
      BRAVIS_DATABASE_URL: postgres://bravis:bravis@postgres:5432/bravis?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    build:
      context: .
      target: api
    command: ["serve"]
    environment:
      BRAVIS_ENV: local
      BRAVIS_HTTP_ADDR: ":8080"
      BRAVIS_DATABASE_URL: postgres://bravis:bravis@postgres:5432/bravis?sslmode=disable
      BRAVIS_LOG_LEVEL: debug
    ports: ["8080:8080"]
    # Identidade visual do cliente. Comentado porque a instalacao padrao nao tem
    # arquivo nenhum — descomente apos copiar `brand.example.yaml` para
    # `brand.yaml`. Somente leitura: a API nunca escreve nele.
    # volumes:
    #   - ./brand.yaml:/etc/bravis/brand.yaml:ro
    # environment tambem precisa de BRAVIS_BRAND_FILE: /etc/bravis/brand.yaml
    depends_on:
      postgres: {condition: service_healthy}
      # Migrar antes de servir: a API nao aplica schema, por decisao (ver
      # postgres.Migrate).
      migrate: {condition: service_completed_successfully}

  # Sem este servico a stack local ACEITA trabalho e nunca o executa: o botao
  # "executar agora" cria o Run, ele entra na fila e fica la para sempre. A API
  # nao executa nada por decisao (secao 37: quem cria nao e quem executa), entao
  # alguem precisa consumir a fila — e este alguem.
  scheduler:
    build:
      context: .
      target: worker
    command: ["scheduler", "--interval", "5s", "--concurrency", "4"]
    environment:
      BRAVIS_ENV: local
      BRAVIS_DATABASE_URL: postgres://bravis:bravis@postgres:5432/bravis?sslmode=disable
      BRAVIS_LOG_LEVEL: debug
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

volumes:
  pgdata:
