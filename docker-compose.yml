# Ambiente local da Phase 0: Postgres + API, nada mais.
#
# `docker compose up` deve deixar GET /health e GET /ready respondendo, que e o
# criterio de conclusao da fase (secao 39 do plano).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: brevis
      POSTGRES_PASSWORD: brevis
      POSTGRES_DB: brevis
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      # A API so sobe depois que o banco aceita conexao — sem isso o primeiro
      # start falha por corrida, e o compose fica num restart loop confuso.
      test: ["CMD-SHELL", "pg_isready -U brevis -d brevis"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build:
      context: .
      target: api
    command: ["migrate", "up"]
    environment:
      BREVIS_DATABASE_URL: postgres://brevis:brevis@postgres:5432/brevis?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    build:
      context: .
      target: api
    command: ["serve"]
    environment:
      BREVIS_ENV: local
      BREVIS_HTTP_ADDR: ":8080"
      BREVIS_DATABASE_URL: postgres://brevis:brevis@postgres:5432/brevis?sslmode=disable
      BREVIS_LOG_LEVEL: debug
      # A interface local fica ABERTA. Fora de BREVIS_ENV=local o processo recusa
      # subir sem credencial, mas aqui ele escuta a sua propria maquina, e pedir
      # senha a cada `make up` so ensinaria o time a desligar a autenticacao.
      #
      # Para ver a tela de login, gere um hash com `brevis hash`, descomente as
      # tres linhas e reinicie:
      BREVIS_AUTH_USUARIO: operador
      BREVIS_AUTH_SENHA_HASH: "pbkdf2-sha256$600000$6ewhY/AG9eqZFyl4FOWz9Q$pGUKCVCWTALSTafMdeS2f8UXS9hNyZRsK9/tlWpzbgU"
      BREVIS_AUTH_SEGREDO: "segredo-local-de-desenvolvimento-com-32-bytes"
    ports: ["8080:8080"]
    # Identidade visual do cliente. Comentado porque a instalacao padrao nao tem
    # arquivo nenhum — descomente apos copiar `brand.example.yaml` para
    # `brand.yaml`. Somente leitura: a API nunca escreve nele.
    # volumes:
    #   - ./brand.yaml:/etc/brevis/brand.yaml:ro
    # environment tambem precisa de BREVIS_BRAND_FILE: /etc/brevis/brand.yaml
    depends_on:
      postgres: {condition: service_healthy}
      # Migrar antes de servir: a API nao aplica schema, por decisao (ver
      # postgres.Migrate).
      migrate: {condition: service_completed_successfully}

  # Sem este servico a stack local ACEITA trabalho e nunca o executa: o botao
  # "executar agora" cria o Run, ele entra na fila e fica la para sempre. A API
  # nao executa nada por decisao (secao 37: quem cria nao e quem executa), entao
  # alguem precisa consumir a fila — e este alguem.
  scheduler:
    build:
      context: .
      target: worker
    command: ["scheduler", "--interval", "5s", "--concurrency", "4"]
    environment:
      BREVIS_ENV: local
      BREVIS_DATABASE_URL: postgres://brevis:brevis@postgres:5432/brevis?sslmode=disable
      BREVIS_LOG_LEVEL: debug
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

volumes:
  pgdata:
