name: Test & Lint

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.27']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Run tests
        run: |
          cd sdk
          go test -v -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./sdk/coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  integration:
    name: Integration
    runs-on: ubuntu-latest
    # Os testes de integração são os únicos que provam que uma linha realmente
    # entra e sai. Existiam desde a v0.2.1 e ficaram parados atrás de uma
    # variável de ambiente até a v0.11.0 -- quando finalmente rodaram, acharam
    # quatro defeitos numa execução. Um teste atrás de variável é um teste que
    # não roda.
    env:
      BREVIS_IT_S3_ENDPOINT: http://localhost:9000
      BREVIS_IT_S3_KEY: brevis
      BREVIS_IT_S3_SECRET: brevis-secret
      GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      # docker run, e não um service container: a imagem oficial do MinIO
      # precisa de "server /data" como comando, e services do Actions não
      # aceitam command.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=brevis \
            -e MINIO_ROOT_PASSWORD=brevis-secret \
            minio/minio:latest server /data

          for i in $(seq 1 40); do
            if curl -fs http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO no ar"
              exit 0
            fi
            sleep 2
          done
          echo "::error::O MinIO não subiu; os testes de S3 não teriam rodado"
          docker logs minio
          exit 1

      - name: Integration - object storage (MinIO)
        run: |
          cd sdk
          go test -v -timeout 10m -run Integration ./from/...

      # secrets não pode ser usado em if: de step, então vira variável de
      # ambiente no job e a checagem é sobre ela.
      - name: Authenticate to Google Cloud
        if: env.GCP_CREDENTIALS != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Integration - BigQuery and GCS
        if: env.GCP_CREDENTIALS != ''
        env:
          BREVIS_IT_PROJECT: ${{ vars.BREVIS_IT_PROJECT }}
          BREVIS_IT_DATASET: ${{ vars.BREVIS_IT_DATASET }}
          BREVIS_IT_BUCKET: ${{ vars.BREVIS_IT_BUCKET }}
        run: |
          cd sdk
          go test -v -timeout 20m -run Integration ./load/... ./from/...

      - name: Say what did not run
        if: env.GCP_CREDENTIALS == ''
        run: |
          echo "::warning::A integração do BigQuery não rodou: falta o secret"
          echo "::warning::GCP_CREDENTIALS e as variáveis BREVIS_IT_PROJECT,"
          echo "::warning::BREVIS_IT_DATASET e BREVIS_IT_BUCKET. Dezessete"
          echo "::warning::testes ficaram em SKIP."

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Run go fmt
        run: |
          cd sdk
          if [ "$(go fmt ./... | wc -l)" -gt 0 ]; then
            echo "❌ gofmt found issues:"
            go fmt ./...
            exit 1
          fi
          echo "✅ gofmt OK"

      - name: Run go vet
        run: |
          cd sdk
          go vet ./...
          echo "✅ go vet OK"

      - name: Run go mod tidy
        run: |
          cd sdk
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "❌ go mod tidy not run"; exit 1)
          echo "✅ go mod tidy OK"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          working-directory: sdk
          args: --timeout=5m

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec-results.sarif ./sdk/...'

      - name: Upload Gosec results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec-results.sarif
          wait-for-processing: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Build SDK
        run: |
          cd sdk
          go build ./...
          echo "✅ Build successful"

      - name: Build the engine
        run: |
          # cmd/brevis is the Brevis binary itself: serve, scheduler, migrate,
          # publish, validate, backfill. It lives in the root module, and for
          # a while nothing built it -- an SDK CLI had been written over its
          # main.go, and the whole engine became a library with no program.
          go build ./...
          go vet ./...
          echo "✅ engine builds"

      - name: Build the SDK CLI
        run: |
          # Its own module, so it pins a released SDK and only breaks on a
          # bump. Nothing else would catch it.
          cd cmd/brevis-sdk
          go build ./...
          go vet ./...
          echo "✅ SDK CLI builds"

      - name: Build and test examples
        run: |
          # No '|| true' here. This step used to swallow every failure and
          # print a success line, which is how six examples that did not
          # compile at all sat in the repo unnoticed.
          cd examples
          go build ./...
          go vet ./...
          go test ./...
          echo "✅ Examples compile and pass"