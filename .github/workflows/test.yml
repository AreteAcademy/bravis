name: Test & Lint

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Run tests
        run: |
          cd sdk
          go test -v -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./sdk/coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run go fmt
        run: |
          cd sdk
          if [ "$(go fmt ./... | wc -l)" -gt 0 ]; then
            echo "❌ gofmt found issues:"
            go fmt ./...
            exit 1
          fi
          echo "✅ gofmt OK"

      - name: Run go vet
        run: |
          cd sdk
          go vet ./...
          echo "✅ go vet OK"

      - name: Run go mod tidy
        run: |
          cd sdk
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "❌ go mod tidy not run"; exit 1)
          echo "✅ go mod tidy OK"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          working-directory: sdk
          args: --timeout=5m

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec-results.sarif ./sdk/...'

      - name: Upload Gosec results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec-results.sarif
          wait-for-processing: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build SDK
        run: |
          cd sdk
          go build ./...
          echo "✅ Build successful"

      - name: Build the engine
        run: |
          # cmd/bravis is the Bravis binary itself: serve, scheduler, migrate,
          # publish, validate, backfill. It lives in the root module, and for
          # a while nothing built it -- an SDK CLI had been written over its
          # main.go, and the whole engine became a library with no program.
          go build ./...
          go vet ./...
          echo "✅ engine builds"

      - name: Build the SDK CLI
        run: |
          # Its own module, so it pins a released SDK and only breaks on a
          # bump. Nothing else would catch it.
          cd cmd/bravis-sdk
          go build ./...
          go vet ./...
          echo "✅ SDK CLI builds"

      - name: Build and test examples
        run: |
          # No '|| true' here. This step used to swallow every failure and
          # print a success line, which is how six examples that did not
          # compile at all sat in the repo unnoticed.
          cd examples
          go build ./...
          go vet ./...
          go test ./...
          echo "✅ Examples compile and pass"